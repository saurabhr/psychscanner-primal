name: Deploy marimo-book to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install marimo-book
        run: pip install marimo-book

      # If your notebooks depend on other libraries to execute (numpy,
      # pandas, your domain packages), install them here too:
      # - name: Install notebook dependencies
      #   run: pip install -r requirements.txt

      - name: Build site
        run: marimo-book build --strict

      # book.yml has no extra_javascript hook and _site_src/mkdocs.yml is
      # regenerated every build, so open this one nav link in a new tab by
      # patching the built HTML directly instead.
      - name: Open psychscanner nav link in a new tab
        run: |
          grep -rl 'href="https://psychscanner.readthedocs.io/en/latest/" class="md-nav__link"' _site \
            | xargs -r sed -i 's|href="https://psychscanner.readthedocs.io/en/latest/" class="md-nav__link"|href="https://psychscanner.readthedocs.io/en/latest/" class="md-nav__link" target="_blank" rel="noopener"|g'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
