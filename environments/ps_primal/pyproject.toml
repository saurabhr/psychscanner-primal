[project]
name = "ps-primal"
description = "Paired-associate recall (single-turn proxy) from psychscanner: score word-pair recall accuracy across five semantic-similarity levels."
tags = ["psychology", "cognitive-science", "memory", "single-turn", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["ps_primal.py", "pyproject.toml", "pal50.json"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 3
