[project]
name = "psychscanner-rm-encoding"
description = "Reality Monitoring (encoding-phase) task from psychscanner: score whether a model correctly echoes a perceived word or generates a valid novel word for an imagined one."
tags = ["psychology", "cognitive-science", "memory", "single-turn", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["psychscanner_rm_encoding.py", "pyproject.toml", "rm_singleturn_demo.json"]

[tool.verifiers.eval]
num_examples = 8
rollouts_per_example = 3
