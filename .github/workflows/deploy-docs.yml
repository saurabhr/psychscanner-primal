name: Deploy docs to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "environments/**"
      - "examples/**"
      - "src/**"
      - "scripts/inject_new_tab_links.py"
      - "CONTRIBUTING.md"
      - "pyproject.toml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install psychscanner-primal + docs deps
        run: pip install -e ".[docs]"

      - name: Build site
        working-directory: docs
        run: marimo-book build --strict --clean

      - name: Open every link in a new tab
        run: python3 scripts/inject_new_tab_links.py docs/_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
